name: Bug report
description: Report a Windows-specific bug or build problem in Tivano Windows.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for bugs and build problems that happen on Windows. Feature requests and Mac behavior questions belong at https://github.com/elijah7x/tivano/issues. Security problems must not be filed here; see CONTRIBUTING.md.
  - type: checkboxes
    id: not-mac
    attributes:
      label: Scope
      options:
        - label: I confirm this is not a problem with Tivano for macOS.
          required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows edition and version
      description: Edition and version number, as shown in Settings > System > About or by running `winver`.
      placeholder: Windows 11 Home 24H2
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64
        - ARM64
        - x86
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: account-type
    attributes:
      label: Account type
      description: Whether the Windows account you ran Tivano Windows under is a standard user or an administrator.
      options:
        - standard
        - administrator
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      description: The version shown in the app, or the commit hash you built from.
      placeholder: 0.1.0 or a commit hash
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - installer
        - dev build
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste logs or drag in screenshots. Remove sensitive information first, such as credentials, tokens, usernames, file paths you do not want public and private project content.
